<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos Fácil</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { font-size: 1.1rem; margin-bottom: 12px; }
        form { display: flex; gap: 10px; flex-wrap: wrap; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 140px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #e9ecef; }
        .btn-delete { background-color: #dc3545; padding: 5px 10px; font-size: 0.85rem; }
        .btn-delete:hover { background-color: #c82333; }
        .empty-msg { text-align: center; color: #777; padding: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestión de Productos</h1>

        <!-- Formulario para Agregar -->
        <div class="card">
            <h2>Añadir Producto</h2>
            <form id="productForm">
                <input type="text" id="nombre" placeholder="Nombre del producto" required>
                <input type="number" step="0.01" id="precio" placeholder="Precio ($)" required>
                <input type="text" id="categoria" placeholder="Categoría" required>
                <button type="submit">Guardar</button>
            </form>
        </div>

        <!-- Buscador -->
        <div class="card">
            <h2>Buscar Productos</h2>
            <input type="text" id="searchInput" placeholder="Escribe para buscar..." style="width: 100%;">
        </div>

        <!-- Tabla -->
        <div class="card">
            <h2>Listado de Productos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Cargar productos de la base de datos interna (localStorage)
        let productos = JSON.parse(localStorage.getItem('mis_productos')) || [
            { id: 1, nombre: 'Cuaderno A5', precio: 4.00, categoria: 'Papelería' },
            { id: 2, nombre: 'Lápiz Óptico', precio: 25.50, categoria: 'Electrónica' }
        ];

        const form = document.getElementById('productForm');
        const searchInput = document.getElementById('searchInput');
        const tableBody = document.getElementById('productTableBody');

        // Mostrar productos al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            renderizarProductos();
        });

        // 1. Mostrar y Buscar Productos
        function renderizarProductos(filtro = '') {
            tableBody.innerHTML = '';
            
            const productosFiltrados = productos.filter(p => 
                p.nombre.toLowerCase().includes(filtro.toLowerCase()) ||
                p.categoria.toLowerCase().includes(filtro.toLowerCase())
            );

            if (productosFiltrados.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="4" class="empty-msg">No se encontraron productos</td></tr>';
                return;
            }

            productosFiltrados.forEach((prod) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${prod.nombre}</td>
                    <td>$${parseFloat(prod.precio).toFixed(2)}</td>
                    <td>${prod.categoria}</td>
                    <td><button class="btn-delete" onclick="eliminarProducto(${prod.id})">Eliminar</button></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 2. Agregar un nuevo Producto
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nuevoProducto = {
                id: Date.now(), // ID único basado en el tiempo
                nombre: document.getElementById('nombre').value,
                precio: document.getElementById('precio').value,
                categoria: document.getElementById('categoria').value
            };

            productos.push(nuevoProducto);
            guardarEnStorage();
            renderizarProductos();
            form.reset();
        });

        // 3. Eliminar Producto
        function eliminarProducto(id) {
            if (confirm('¿Seguro que deseas eliminar este producto?')) {
                productos = productos.filter(p => p.id !== id);
                guardarEnStorage();
                renderizarProductos(searchInput.value);
            }
        }

        // 4. Filtrar mientras se escribe en el buscador
        searchInput.addEventListener('input', (e) => {
            renderizarProductos(e.target.value);
        });

        // Guardar la lista en la memoria del navegador
        function guardarEnStorage() {
            localStorage.setItem('mis_productos', JSON.stringify(productos));
        }
    </script>
</body>
</html>
